<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">まとめて紹介ページ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6996">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    color: #3a2e26;
    line-height: 1.7;
    background: #fdf6f0;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    background: rgba(255,255,255,0.9);
    border: 1px solid #e0d3c2;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    color: #6a4a30;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    color: #6a4a30;
    margin: 10px 0 4px;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8a7a6d;
    margin-bottom: 16px;
  }
  .event-banner {
    text-align: center;
    background: #ff6996;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .event-banner-label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .event-banner #event-date { font-size: 22px; }
  .location-link {
    display: inline-block;
    margin-top: 4px;
    color: #fff;
    font-size: 15px;
    text-decoration: underline;
  }
  .notice-box {
    background: #fff8ec;
    border: 1px solid #f0d9a8;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #6b5c4d;
    white-space: pre-wrap;
    line-height: 1.8;
  }
  .notice-box .notice-label {
    font-weight: 700;
    color: #b8860b;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .print-btn {
    display: block;
    margin: 0 auto 20px;
    background: #ff6996;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .page-qr-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .page-qr-title {
    font-weight: 700;
    font-size: 15px;
    color: #6a4a30;
    margin-bottom: 4px;
  }
  .page-qr-desc {
    font-size: 12px;
    color: #8a7a6d;
    margin: 0 0 10px;
  }
  #page-qr-box { display: flex; justify-content: center; margin-bottom: 10px; }
  .share-btn { margin-bottom: 0; }
  #page-share-status { text-align: center; font-size: 12px; color: #8a7a6d; margin-top: 6px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
  }
  .cat-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    box-shadow: 0 3px 14px rgba(0,0,0,0.08);
  }
  .cat-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .no-photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: #f0e8dd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .cat-card-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .cat-card .name {
    font-weight: 700;
    font-size: 15px;
    color: #6a4a30;
    margin-top: 8px;
  }
  .cat-card .qr-wrap {
    margin-top: 8px;
    display: flex;
    justify-content: center;
  }
  .empty-note, .loading {
    text-align: center;
    color: #8a7a6d;
    font-size: 14px;
    padding: 40px 20px;
  }
  .footer-note {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #a97a45;
    margin-top: 28px;
  }
  @media print {
    .back-btn, .print-btn { display: none !important; }
    .tap-note { display: none !important; }
    body { background: #fff; }
    .cat-card { box-shadow: none; border: 1px solid #eee0d0; break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="wrap">
  <button type="button" class="back-btn" id="back-btn">← 戻る</button>
  <div class="event-banner hidden" id="event-banner">
    <div class="event-banner-label">🐾 譲渡会開催・参加予定</div>
    <div id="event-date"></div>
    <div id="event-location"></div>
  </div>
  <div class="notice-box hidden" id="notice-box">
    <div class="notice-label">📢 お知らせ</div>
    <div id="notice-text"></div>
  </div>

  <div class="page-qr-card">
    <div class="page-qr-title">📱 このページ自体のQRコード</div>
    <p class="page-qr-desc">このQRコードを読み取ると、このまとめページ自体が開きます。</p>
    <div id="page-qr-box"></div>
    <button type="button" class="print-btn share-btn" id="page-share-btn">📤 このページを共有する</button>
    <p class="hint-text" id="page-share-status"></p>
  </div>

  <p class="sub">それぞれのQRコードを読み取ると、その子の公開ページが開きます。</p>
  <p class="sub tap-note">📱 スマホでこのページを見ている場合は、写真や名前をタップしても、その子の公開ページに移動できます。</p>
  <button type="button" class="print-btn" id="print-btn">🖨️ このページを印刷する</button>
  <div id="grid" class="grid">
    <div class="loading">🐾 読み込んでいます...</div>
  </div>
  <div class="footer-note" id="footer-note" style="display:none;">🐾 ご縁がありますように 🐾</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { db } from "./firebase-config.js?v=1784218044";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { ORG_NAME, APP_TITLE } from "./site-config.js?v=1784218044";

  const titleText = ORG_NAME ? `${APP_TITLE}(${ORG_NAME})` : APP_TITLE;
  document.getElementById("page-title").textContent = `まとめて紹介ページ | ${titleText}`;

  const backBtn = document.getElementById("back-btn");
  if (window.history.length > 1) {
    backBtn.addEventListener("click", () => window.history.back());
  } else {
    backBtn.style.display = "none";
  }

  document.getElementById("print-btn").addEventListener("click", () => window.print());

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // このページ自体のQRコードを表示し、共有できるようにする
  new QRCode(document.getElementById("page-qr-box"), {
    text: window.location.href,
    width: 160,
    height: 160,
    colorDark: "#5a3a1e",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById("page-share-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("page-share-status");
    const shareData = {
      title: "まとめて紹介ページ",
      text: "保護犬猫のまとめて紹介ページです。よかったら見てください🐾",
      url: window.location.href
    };
    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch (err) {
        // 共有をキャンセルした場合などは何もしない
      }
    } else {
      try {
        await navigator.clipboard.writeText(window.location.href);
        statusEl.textContent = "共有機能が使えない端末のため、リンクをコピーしました。";
      } catch (err) {
        statusEl.textContent = "コピーできませんでした。";
      }
    }
  });

  async function main() {
    const params = new URLSearchParams(window.location.search);
    const ids = (params.get("ids") || "").split(",").map((s) => s.trim()).filter(Boolean);
    const grid = document.getElementById("grid");

    const eventDate = params.get("date");
    const locName = params.get("locName");
    const locAddress = params.get("locAddress");

    if (eventDate || locName) {
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      if (eventDate) {
        const d = new Date(eventDate + "T00:00:00");
        if (!isNaN(d.getTime())) {
          const dateText = `${d.getMonth() + 1}月${d.getDate()}日(${weekdays[d.getDay()]})`;
          document.getElementById("event-date").textContent = dateText;
        }
      }
      if (locName) {
        const mapQuery = encodeURIComponent(locAddress || locName);
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
        document.getElementById("event-location").innerHTML = `<a href="${mapUrl}" target="_blank" rel="noopener" class="location-link">📍 ${escapeHtml(locName)}</a>`;
      }
      document.getElementById("event-banner").classList.remove("hidden");
    }
    const notice = params.get("notice");
    if (notice) {
      document.getElementById("notice-text").textContent = notice;
      document.getElementById("notice-box").classList.remove("hidden");
    }

    if (ids.length === 0) {
      grid.innerHTML = `<div class="empty-note">🐾 URLに子の指定がありません。</div>`;
      return;
    }

    const baseUrl = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, "")}`;
    grid.innerHTML = "";
    let shownCount = 0;

    for (const id of ids) {
      let snap;
      try {
        snap = await getDoc(doc(db, "publicProfiles", id));
      } catch (err) {
        continue;
      }
      if (!snap.exists()) continue;
      const data = snap.data();
      shownCount++;

      const card = document.createElement("div");
      card.className = "cat-card";
      const photoHtml = data.photoData
        ? `<img src="${data.photoData}" alt="">`
        : `<div class="no-photo">🐱</div>`;
      const profileUrl = `profile.html?id=${id}`;
      card.innerHTML = `
        <a href="${profileUrl}" class="cat-card-link">
          ${photoHtml}
          <div class="name">${escapeHtml(data.name || "")}</div>
        </a>
        <div class="qr-wrap" id="qr-${id}"></div>
      `;
      grid.appendChild(card);

      new QRCode(document.getElementById(`qr-${id}`), {
        text: `${baseUrl}profile.html?id=${id}`,
        width: 130,
        height: 130,
        colorDark: "#5a3a1e",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    if (shownCount === 0) {
      grid.innerHTML = `<div class="empty-note">🐾 表示できる子がいませんでした。(公開が終了している可能性があります)</div>`;
    } else {
      document.getElementById("footer-note").style.display = "block";
    }
  }

  main();
</script>
</body>
</html>
